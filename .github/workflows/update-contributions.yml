name: Update Contribution Graph

on:
  schedule:
    # Runs once in the middle of every month (15th at 00:00 UTC)
    - cron: '0 0 15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-skyline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch GitHub contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs

      - name: Generate 3D skyline SVG
        run: node scripts/generate-svg.mjs

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github.json skyline.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(contributions): auto-update skyline data and svg [skip ci]"
            git push
          fi
